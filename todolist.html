<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To‑Do List | Productivity Tool</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e40af, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #022c22;
    }

    .app {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #00a38c;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    /* FORM */
    #todo-form {
      display: flex;
      gap: 10px;
    }

    #todo-input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
    }

    #todo-input:focus {
      outline: none;
      border-color: #00a38c;
      box-shadow: 0 0 0 2px rgba(0, 163, 140, 0.2);
    }

    button {
      background: #00a38c;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background: #017a68;
    }

    /* TODO LIST */
    #todos {
      list-style: none;
      margin-top: 20px;
    }

    #todos li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      margin-bottom: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #todos li:hover {
      background: #e5e7eb;
    }

    #todos li.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .delete-btn {
      background: transparent;
      color: crimson;
      font-size: 18px;
      border: none;
      cursor: pointer;
      padding-left: 10px;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>📝 To‑Do List</h1>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task..."
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todos"></ul>

    <p class="empty" id="empty-msg">No tasks yet. Add one 🚀</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', loadTodos);

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const todosList = document.getElementById('todos');
    const emptyMsg = document.getElementById('empty-msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      addTodo(input.value.trim());
      input.value = '';
    });

    function addTodo(task) {
      if (!task) return;

      const li = createTodoElement(task, false);
      todosList.appendChild(li);
      saveTodos();
      toggleEmptyMessage();
    }

    function createTodoElement(task, completed) {
      const li = document.createElement('li');
      li.textContent = task;

      if (completed) {
        li.classList.add('completed');
      }

      li.addEventListener('click', function () {
        li.classList.toggle('completed');
        saveTodos();
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.innerHTML = '✕';
      deleteBtn.className = 'delete-btn';

      deleteBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        li.remove();
        saveTodos();
        toggleEmptyMessage();
      });

      li.appendChild(deleteBtn);
      return li;
    }

    function saveTodos() {
      const todos = [];
      document.querySelectorAll('#todos li').forEach(li => {
        todos.push({
          task: li.firstChild.textContent,
          completed: li.classList.contains('completed'),
        });
      });
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function loadTodos() {
      const todos = JSON.parse(localStorage.getItem('todos')) || [];
      todos.forEach(todo => {
        const li = createTodoElement(todo.task, todo.completed);
        todosList.appendChild(li);
      });
      toggleEmptyMessage();
    }

    function toggleEmptyMessage() {
      emptyMsg.style.display =
        todosList.children.length === 0 ? 'block' : 'none';
    }
  </script>

</body>
</html>
